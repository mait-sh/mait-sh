name: Label sync

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/scripts/sync_labels.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would change
        type: boolean
        default: true
      prune:
        description: Delete labels that are not in .github/labels.yml
        type: boolean
        default: false

permissions: {}

concurrency:
  group: label-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on push, so a push to main applies the file.
          DRY_RUN: ${{ inputs.dry_run }}
          PRUNE: ${{ inputs.prune }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ "$PRUNE" = true ]; then args+=(--prune); fi
          python3 .github/scripts/sync_labels.py .github/labels.yml "${args[@]}"
